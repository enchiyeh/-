<script>
  const busIdToName = {
    '187559': '208', '213656': '247區', '28101': '267', '23484': '287區',
    '197118': '556', '22703': '646', '30212': '北環', '189074': '957',
    '11993': '紅2', '12227': '紅3區', '174553': '紅3'
  };

  const destinations = {
    '芝山': ['267'],
    '士林': ['北環', '957'],
    '劍潭': ['556', '646', '紅3區', '紅3'],
    '圓山': ['208', '247區', '287區', '紅2']
  };

  async function loadBusData() {
    const statusEl = document.getElementById('status');
    const containerEl = document.getElementById('bus-container');

    try {
      const targetUrl = 'https://pda5284.gov.taipei/MQS/StopLocationDyna?stoplocationid=1000695';
      
      // 改用反應速度極快的 corsproxy.io
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
      
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error('Network response was not ok');
      
      const jsonContent = await response.json();

      let groupedData = { '芝山': [], '士林': [], '劍潭': [], '圓山': [] };

      if (jsonContent.Stop && Array.isArray(jsonContent.Stop)) {
        jsonContent.Stop.forEach(bus => {
          const busId = String(bus.id || '');
          if (busIdToName[busId]) {
            const busNumber = busIdToName[busId];
            const n1Data = (bus.n1 || '').split(',');

            let arrivalTime = "未發車";
            let busTimeClass = "";

            if (n1Data.length >= 8) {
              const eta1 = n1Data[3];
              const eta2 = n1Data[7];
              const seconds = parseInt(eta2, 10);

              if (eta1 === '-1' && eta2 === '-4') {
                arrivalTime = '未營運';
              } else if (eta1 === '-1' && eta2 === '-3') {
                arrivalTime = '末班已過';
              } else if (eta1 === '0' || (eta2 === '0' && eta1 === '')) {
                arrivalTime = '進站中';
                busTimeClass = 'urgent';
              } else if (eta1 && eta1.includes('&#x3a;')) {
                arrivalTime = eta1.replace('&#x3a;', ':') + '發車';
              } else if (!isNaN(seconds) && seconds > 0) {
                const calculatedMinutes = Math.floor(seconds / 60);
                if (seconds < 60) {
                  arrivalTime = '衝啊！';
                  busTimeClass = 'urgent';
                } else if (calculatedMinutes <= 6) {
                  arrivalTime = `${calculatedMinutes} 分`;
                  busTimeClass = 'urgent';
                } else {
                  arrivalTime = `${calculatedMinutes} 分`;
                }
              }
            }

            for (const [dest, routes] of Object.entries(destinations)) {
              if (routes.includes(busNumber)) {
                groupedData[dest].push({
                  number: busNumber,
                  time: arrivalTime,
                  class: busTimeClass
                });
                break;
              }
            }
          }
        });
      }

      let destCardsHtml = "";
      for (const [dest, items] of Object.entries(groupedData)) {
        destCardsHtml += `<div class="destination-card"><h2>${dest}</h2>`;
        if (items.length > 0) {
          destCardsHtml += '<div class="bus-grid">';
          items.forEach(item => {
            const timeClass = `bus-time ${item.class}`.trim();
            destCardsHtml += `
              <div class="bus-card">
                <span class="bus-number">${item.number}</span>
                <div class="bus-divider"></div>
                <span class="${timeClass}">${item.time}</span>
              </div>
            `;
          });
          destCardsHtml += '</div>';
        } else {
          destCardsHtml += '<p style="text-align:center;">目前無資料</p>';
        }
        destCardsHtml += '</div>';
      }

      containerEl.innerHTML = destCardsHtml;
      const now = new Date();
      statusEl.innerText = `最後更新：${now.toLocaleTimeString()}`;

    } catch (e) {
      statusEl.innerText = "資料讀取失敗或連線逾時，請重新整理頁面。";
      console.error(e);
    }
  }

  loadBusData();
</script>
